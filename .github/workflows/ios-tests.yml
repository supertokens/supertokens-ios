name: "iOS Tests"

on:
    pull_request:
        types:
            - opened
            - reopened
            - synchronize
            - ready_for_review

jobs:
    ios-tests:
        name: Run iOS tests
        runs-on: macos-latest
        timeout-minutes: 45

        steps:
            - uses: actions/checkout@v4

            - name: Verify Docker is available
              run: docker info

            - uses: actions/setup-node@v4
              with:
                  node-version: "20.18.1"
                  cache: npm
                  cache-dependency-path: testHelpers/server/package-lock.json

            - name: Install test server dependencies
              working-directory: testHelpers/server
              run: npm ci

            - name: Install iOS test app dependencies
              working-directory: testHelpers/testapp
              run: pod install

            - name: Select simulator
              run: |
                  set -euo pipefail

                  simulator_id=$(
                    xcrun simctl list devices available --json |
                    ruby -rjson -e '
                      devices = JSON.parse(STDIN.read).fetch("devices").values.flatten
                      iphone = devices.find { |device| device.fetch("name").start_with?("iPhone") && device.fetch("isAvailable") }
                      abort("No available iPhone simulator found") if iphone.nil?
                      puts iphone.fetch("udid")
                    '
                  )

                  echo "SIMULATOR_ID=$simulator_id" >> "$GITHUB_ENV"

            - name: Start test harness
              working-directory: testHelpers/server
              run: |
                  set -euo pipefail

                  TEST_MODE=testing npm run harness > "$RUNNER_TEMP/test-harness.log" 2>&1 &
                  echo "HARNESS_PID=$!" >> "$GITHUB_ENV"

                  for _ in {1..60}; do
                    if curl -fsS http://127.0.0.1:8080/ping >/dev/null; then
                      exit 0
                    fi
                    sleep 1
                  done

                  cat "$RUNNER_TEMP/test-harness.log"
                  exit 1

            - name: Run iOS tests
              run: |
                  set -euo pipefail

                  xcodebuild test \
                    -enableCodeCoverage YES \
                    -workspace testHelpers/testapp/SuperTokensSession.xcworkspace \
                    -scheme SuperTokensSession-Example \
                    -sdk iphonesimulator \
                    -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
                    -resultBundlePath "$RUNNER_TEMP/SuperTokensIOS.xcresult" \
                    ONLY_ACTIVE_ARCH=NO

            - name: Stop test harness
              if: always() && env.HARNESS_PID != ''
              run: kill "$HARNESS_PID" || true

            - name: Upload test harness log
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: test-harness-log
                  path: ${{ runner.temp }}/test-harness.log

            - name: Upload test result bundle
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: ios-test-results
                  path: ${{ runner.temp }}/SuperTokensIOS.xcresult
