name: "Pre commit hook check"

on:
    pull_request:
        types:
            - opened
            - reopened
            - edited
            - synchronize

jobs:
    pr-title:
        name: Pre commit hook check
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - run: git init && git add --all && git -c user.name='test' -c user.email='test@example.com' commit --allow-empty -m 'init for pr action'
            - run: ./hooks/pre-commit.sh
